# The demo image builds with the pinned index inside it, answers a retrieval question
# with no network and no API key, and — on master only — is pushed to
# ghcr.io/adssib/infrachat-api for the demo-up workflow to run (docs/DEMO-PLAN.md § 4).
name: CI_docker_build

on:
  pull_request:
    paths: ["infrachat/**", "Dockerfile", ".dockerignore", "requirements.txt", "config.yaml", "sources.yaml", ".github/workflows/CI_docker_build.yml"]
  push:
    branches: [master]
    paths: ["infrachat/**", "Dockerfile", ".dockerignore", "requirements.txt", "config.yaml", "sources.yaml", ".github/workflows/CI_docker_build.yml"]
  workflow_dispatch:

# The index is a build artifact on a GitHub Release, not in git (data/ is gitignored).
# Bumping these two lines is the commit that records "the corpus changed" — and a new
# index invalidates comparison with every earlier eval run.
env:
  INDEX_VERSION: index-v1
  INDEX_SHA256: 8c5268a2c5739d904669d064465e98c18a09cb52f355124c301a442214119e08
  IMAGE: ghcr.io/adssib/infrachat-api

permissions:
  contents: read
  packages: write

# A new push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: docker build + smoke (+ push on master)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: download the pinned index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download "$INDEX_VERSION" --pattern infrachat.db --dir data
          echo "$INDEX_SHA256  data/infrachat.db" | sha256sum --check

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=infrachat-api
            dev.infrachat.index=${{ env.INDEX_VERSION }}

      # Built and loaded locally first, so the smoke test runs against the exact image
      # that gets pushed.
      - name: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: image size
        run: |
          docker image ls "$IMAGE" --format 'image size: {{.Size}}'

      # The deployment model's real test (docs/DEPLOY.md): no network, no volume, no key,
      # and it still retrieves from the baked-in index with the baked-in embedder.
      - name: smoke — retrieval with --network none
        run: |
          out=$(docker run --rm --network none "$IMAGE:${{ github.sha }}" \
            ask --retrieval-only -c config.yaml "what is a Pod?")
          echo "$out"
          grep -q "^passed: top-1" <<<"$out"
          grep -q "kubernetes:workloads/pods/_index" <<<"$out"

      - name: the image doesn't run as root
        run: test "$(docker run --rm --entrypoint id "$IMAGE:${{ github.sha }}" -u)" != 0

      - name: log in to ghcr.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: docker push --all-tags "$IMAGE"
