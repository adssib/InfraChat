# The corpus definition — WHAT gets ingested and how to clean it.
#
# Adding a doc set is an entry here, never a code change. Two things must be true
# of a new source: its files are text, and `clean` names a strategy that knows how
# to strip its markup.
#
# NOTE: adding a source changes the corpus, which invalidates comparison with every
# earlier eval run. Add one at a phase boundary, then re-run the baseline.

defaults:
  exclude_globs:
    - "**/node_modules/**"
    - "**/.git/**"
    - "**/_print/**"
  # Target credential FILE FORMS, not any filename containing the word: "*secret*" also
  # matches the Kubernetes Secrets documentation, which is exactly what we want to index.
  # Nothing here can match a .md file, so docs are structurally safe.
  secret_patterns: [".env", ".env.*", "credentials", "credentials.*",
                    "*.pem", "*.key", "*.pfx", "id_rsa*", ".htpasswd"]
  max_file_bytes: 100000

sources:
  - name: kubernetes
    label: "Kubernetes"
    repo: "https://github.com/kubernetes/website"
    path: "corpus/kubernetes-website/content/en/docs/concepts"
    repo_path: "content/en/docs/concepts"
    commit: "00ace9cad04f8c65259fce8c810d3b4440ded9c6"   # the index-v1 build; citations link here
    include_ext: [".md"]
    clean: hugo                    # Hugo shortcodes: {{< note >}}, glossary_tooltip

  - name: docker
    label: "Docker"
    repo: "https://github.com/docker/docs"
    path: "corpus/docker-docs/content/manuals/build"
    repo_path: "content/manuals/build"
    commit: "ff96ad1711065cf2e9c3f1d701dad04775834f70"   # the index-v1 build; citations link here
    include_ext: [".md", ".mdx"]
    clean: hugo

  # Adding Ansible later is exactly this — no code change:
