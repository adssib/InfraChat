    class: should-refuse
    expect_source: null
    expect_docs: []
    tags: [near-miss]
    note: >-
      Scores 0.813, and the top-1 chunk is the single most quotable wrong answer in the
      corpus: building/best-practices.md's "### VOLUME" section, which is about the
      Dockerfile VOLUME *instruction*, not about runtime volume management. The corpus
      has zero chunks containing "docker volume create" or "named volume"; the only
      "docker volume" mentions (3, all builders/drivers/docker-container.md) are
      `docker volume ls` listing BuildKit's own state volume. Kubernetes
      storage/volumes.md also lands at rank 4, so the model has two adjacent vocabularies
      to borrow from and no instructions to follow. The real answer — `docker volume
      create` plus `-v pgdata:/var/lib/postgresql/data` — is not in the index.

  - id: refuse-docker-bridge-dns
