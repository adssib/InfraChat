      contains the literal command `docker network create foonet`. Every ingredient of a
      fabricated answer is present and none of it is the answer: the one `docker network
      create` chunk is about giving a *builder* a network, and the corpus has zero chunks
      containing "user-defined bridge". Container-to-container DNS resolution is Docker
      networking documentation, which is outside the manuals/build slice.

  - id: refuse-docker-run-restart
