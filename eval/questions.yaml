# The fixed question set — 87 questions, held constant across every phase.
#
# ADDING OR REWORDING A QUESTION INVALIDATES COMPARISON WITH EVERY EARLIER RUN
# (docs/EVAL.md § What makes two runs comparable). Changes land at a phase boundary
# only, followed by a baseline re-run. Each run records `question_set_sha256` so two
# result files can be checked for comparability; the value is not written here,
# because writing it into the file would change it.
#
# Balance (docs/EVAL.md § The question set):
#   k8s-answerable     33   (38%)
#   docker-answerable  33   (38%)
#   should-refuse      21   (24%)
#
# How the set was designed, what was deliberately discarded, and why no further
# cross-source question exists on this corpus: eval/README.md
#
# ---------------------------------------------------------------- schema
#
#   id             stable slug; the JSONL row key, so never renamed
#   question       asked verbatim, unmodified
#   class          k8s-answerable | docker-answerable | should-refuse
#   expect_source  the doc set whose citation is correct (F10). A LIST means either
#                  is correct — the "both-source" case. `null` for should-refuse.
#   expect_docs    the document(s) that answer it. Matched against `Chunk.source_doc`,
#                  which is relative to the SOURCE ROOT configured in sources.yaml
#                  (`workloads/pods/_index.md`, not
#                  `content/en/docs/concepts/workloads/pods/_index.md` — see
#                  ingest/loader.py `walk`). Empty for should-refuse.
#   tags           which hard case this question exists to exercise. Not decoration:
#                  docs/EVAL.md requires the per-class breakdown ("hybrid may be flat
#                  overall and decisive on exact-term questions"), and the aggregate
#                  cannot be decomposed without these.
#                      exact-term   a literal token BM25 should win on (Phase 3)
#                      paraphrase   never uses the doc's vocabulary (Phase 4)
#                      both-source  answerable from either doc set
#                      cross-source the answer sits in the OTHER doc set than the
#                                   question's vocabulary suggests — an F10 trap
#                      near-miss    a refusal that is adjacent to the corpus
#                      easy         the sanity case; if this fails, nothing works
#   note           why this question is in the set, and what its failure would mean
#
# Every expect_docs path below was verified to exist in the index, and every question
# was run through `ask --retrieval-only` against data/infrachat.db before being added.
# The corpus is a SLICE, not the whole docs: kubernetes = .../docs/concepts,
# docker = .../manuals/build. Questions outside those slices belong in should-refuse.

questions:

  # ------------------------------------------------------------ k8s-answerable (12)

  - id: k8s-pod-basics
    question: "What is a Pod?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["workloads/pods/_index.md"]
    tags: [easy]
    note: >-
      The floor case. Retrieved at 0.834 with three chunks of the right page in the
      top 5; if this ever misses, the index or the embedder changed, not the component
      under test.

  - id: k8s-crashloopbackoff
    question: "What does CrashLoopBackOff mean?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["workloads/pods/pod-lifecycle.md"]
    tags: [exact-term]
    note: >-
      A single opaque token that appears in 10 chunks, all on one page. Dense already
      wins here (0.856); BM25 should at worst tie, and a Phase 3 regression on this
      question means fusion is hurting exact matches.

  - id: k8s-imagepullpolicy
    question: "What are the valid values of imagePullPolicy?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["containers/images.md"]
    tags: [exact-term]
    note: >-
      camelCase API field. Two Docker policy pages score 0.74 against it, so this also
      watches cross-source attribution on an exact term.

  - id: k8s-probes-liveness-vs-readiness
    question: "What is the difference between a liveness probe and a readiness probe?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["workloads/pods/probes.md", "workloads/pods/pod-lifecycle.md"]
    tags: []
    note: >-
      A comparison question: the answer needs two sections of one page, so it is the
      clearest case of citation validity mattering more than hit-rate.

  - id: k8s-noexecute-taint
    question: "What does the NoExecute taint effect do?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["scheduling-eviction/taint-and-toleration.md"]
    tags: [exact-term]
    note: >-
      Deliberate MRR headroom: top-1 is device-taints.md (0.795), a DRA page that
      mentions the term, and the page that defines it only reaches rank 2. A reranker
      that cannot fix this is not reading the question.

  - id: k8s-oom-eviction-order
    question: "When a node runs out of memory, which pod gets killed first?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["workloads/pods/pod-qos.md", "scheduling-eviction/node-pressure-eviction.md"]
    tags: [paraphrase]
    note: >-
      Says neither "QoS class" nor "eviction" — the two words the answering pages are
      built on. node-pressure-eviction.md reaches rank 2; pod-qos.md, which actually
      states the ordering, is absent from the top 5 entirely.

  - id: k8s-secret-for-db-password
    question: "How do I store a database password so a container can read it?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["configuration/secret.md"]
    tags: [paraphrase, cross-source]
    note: >-
      The hardest answerable question in the set and the sharpest F10 trap: top-1 is a
      DOCKER page (metadata/attestations, 0.725) and the correct Kubernetes page is
      rank 4. "Secret" is a word both doc sets own, so a wrong citation here is a
      source-accuracy failure, not a retrieval failure.

  - id: k8s-pvc-basics
    question: "What is a PersistentVolumeClaim?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["storage/persistent-volumes.md"]
    tags: []
    note: >-
      Storage is the largest subtree in the Kubernetes slice (~400 chunks); without a
      storage question a whole class of regression would go unseen.

  - id: k8s-deployment-maxsurge
    question: "What does maxSurge control during a Deployment rollout?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["workloads/controllers/deployment.md"]
    tags: [exact-term]
    note: >-
      An exact term inside the single largest document (94 chunks). Tests that a
      literal field name can be found in a long page, not just on a short one.

  - id: k8s-init-vs-sidecar-containers
    question: "How do init containers differ from sidecar containers?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["workloads/pods/init-containers.md", "workloads/pods/sidecar-containers.md"]
    tags: []
    note: >-
      The answer legitimately spans two documents, so a single correct citation is a
      partial answer. Watches whether the generator cites both pages it was shown.

  - id: k8s-anti-affinity-spread
    question: "How do I stop two copies of the same app from being placed on one node?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["scheduling-eviction/assign-pod-node.md", "scheduling-eviction/topology-spread-constraints.md"]
    tags: [paraphrase]
    note: >-
      The weakest baseline retrieval in the set: no mention of affinity, topology or
      constraint, so assign-pod-node.md never appears and topology-spread-constraints.md
      scrapes in at rank 5 (0.691). Rank 5 of 5 is where a rewriter or a reranker has
      the most to prove.

  - id: k8s-service-clusterip
    question: "What is a Service of type ClusterIP?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["services-networking/service.md", "services-networking/cluster-ip-allocation.md"]
    tags: [exact-term]
    note: >-
      Networking coverage plus MRR headroom: top-1 is field-selectors.md (0.836),
      which merely uses ClusterIP in an example, and service.md is rank 2.

  # ------------------------------------------------------------ docker-answerable (12)

  - id: dkr-multi-stage-basics
    question: "What is a multi-stage build?"
    class: docker-answerable
    expect_source: docker
    expect_docs: ["building/multi-stage.md", "building/best-practices.md"]
    tags: [easy]
    note: >-
      The Docker-side sanity case. best-practices.md opens with the multi-stage
      section, so both pages are legitimate answers.

  - id: dkr-shrink-image
    question: "My image is 1.5GB. How do I shrink it?"
    class: docker-answerable
    expect_source: docker
    expect_docs: ["building/multi-stage.md", "building/best-practices.md"]
    tags: [paraphrase, cross-source]
    note: >-
      docs/EVAL.md's named rewriter case, and the only answerable question the baseline
      MISSES outright: it never says "multi-stage", "layer" or even "image size", so the
      top 5 is Kubernetes storage/volumes.md and Docker metadata/annotations.md and
      neither answering page appears at all (top-1 0.678). Without it hit-rate@5 sits at
      1.000 and Phases 3-4 have nowhere to move it. The expected baseline outcome is a
      false refusal — a real cost of dense-only retrieval, recorded rather than hidden.

  - id: dkr-cache-mount
    question: "What does --mount=type=cache do in a RUN instruction?"
    class: docker-answerable
    expect_source: docker
    expect_docs: ["cache/optimize.md", "cache/invalidation.md"]
    tags: [exact-term]
    note: >-
      Punctuation-heavy literal (8 chunks contain it verbatim). The case most likely to
      expose a tokenisation difference between the dense and BM25 arms in Phase 3.

  - id: dkr-build-secret
    question: "How do I pass a secret to a build without baking it into the image?"
    class: docker-answerable
    expect_source: docker
    expect_docs: ["building/secrets.md"]
    tags: []
    note: >-
      The Docker half of the "secret" collision with k8s-secret-for-db-password. Both
      must cite their own doc set for source accuracy to mean anything.

  - id: dkr-arg-vs-env
    question: "What is the difference between ARG and ENV in a Dockerfile?"
    class: docker-answerable
    expect_source: docker
    expect_docs: ["building/variables.md", "concepts/dockerfile.md"]
    tags: [exact-term]
    note: >-
      Two three-letter uppercase tokens that also appear as ordinary English ("ARG"
      matches 229 Docker and 222 Kubernetes chunks). A BM25 arm with no term weighting
      could easily make this worse, not better.

  - id: dkr-bake-inheritance
    question: "How do I inherit from another target in a bake file?"
    class: docker-answerable
    expect_source: docker
    expect_docs: ["bake/inheritance.md"]
    tags: [exact-term]
    note: >-
      The answerable counterpart to refuse-sourdough-bake. Same "bake" vocabulary, one
      must be answered and the other refused — which is the whole point of keeping
      them both in the set.

  - id: dkr-multi-platform
    question: "How do I build an image for both arm64 and amd64?"
    class: docker-answerable
    expect_source: docker
    expect_docs: ["building/multi-platform.md"]
    tags: []
    note: >-
      Architecture names, not the word "multi-platform". Sits between exact-term and
      paraphrase: the tokens are literal but absent from the page's headings.

  - id: dkr-cache-mode-max
    question: "What does mode=max mean for a cache export?"
    class: docker-answerable
    expect_source: docker
    expect_docs: ["cache/backends/_index.md"]
    tags: [exact-term]
    note: >-
      A key=value literal. Dense handles it at 0.853 today; the interesting outcome is
      whether fusion holds that, since `floor` reads whatever score the last stage wrote.

  - id: dkr-driver-difference
    question: "What is the difference between the docker and docker-container driver?"
    class: docker-answerable
    expect_source: docker
    expect_docs: ["builders/drivers/docker-container.md", "builders/drivers/docker.md", "builders/drivers/_index.md"]
    tags: [exact-term]
    note: >-
      Two names that differ by one hyphenated suffix — the case where a dense embedding
      is most likely to conflate two documents it should separate.

  - id: dkr-build-inside-k8s
    question: "How do I build container images inside a Kubernetes cluster?"
    class: docker-answerable
    expect_source: docker
    expect_docs: ["builders/drivers/kubernetes.md"]
    tags: [cross-source]
    note: >-
      The F10 trap in the other direction: the question is phrased in Kubernetes
      vocabulary but only the Docker docs answer it. Baseline top-1 is Kubernetes
      containers/images.md (0.816, about pulling images), with the four correct Docker
      chunks at ranks 2-5. Citing Kubernetes here is a source-accuracy failure.

  - id: dkr-cache-layer-ordering
    question: "How do I stop pip install from running again every time I change my source code?"
    class: docker-answerable
    expect_source: docker
    expect_docs: ["cache/invalidation.md", "building/best-practices.md", "cache/optimize.md"]
    tags: [paraphrase]
    note: >-
      Names a tool the corpus barely mentions and no concept the answer uses — not
      "layer", "cache invalidation" or "COPY order". The answering page reaches rank 1
      anyway (0.740), which is itself worth recording as a baseline fact.

  - id: dkr-gpu-access
    question: "How do I give a container access to a GPU?"
    class: docker-answerable
    expect_source: [docker, kubernetes]
    expect_docs: ["building/cdi.md", "extend-kubernetes/compute-storage-net/device-plugins.md"]
    tags: [both-source]
    note: >-
      docs/EVAL.md's both-source case: answerable from either doc set (Docker CDI for
      builders, Kubernetes device plugins for pods), so either citation is correct and
      the metric checks only that the citation names the doc set it actually used.
      Baseline returns five Docker CDI chunks and no Kubernetes page.

  # ------------------------------------------------------------ should-refuse (6)

  - id: refuse-sourdough-bake
    question: "How do I bake sourdough bread?"
    class: should-refuse
    expect_source: null
    expect_docs: []
    tags: [near-miss]
    note: >-
      The documented collision (CLAUDE.md, answer/citations.py): scores 0.652 because
      Docker's build tool is called Bake, so it clears floor=0.55 and the retrieval
      gate cannot catch it. This question exists to prove gate 2 — the citation check —
      does work that the floor cannot.

  - id: refuse-podman-rootless
    question: "How does Podman rootless networking work?"
    class: should-refuse
    expect_source: null
    expect_docs: []
    tags: [near-miss]
    note: >-
      docs/EVAL.md's named hard refusal. Scores 0.742: "rootless" appears in four
      Docker chunks and "podman" in two Kubernetes ones, both only in passing. Every
      word is in-domain and none of it is answerable.

  - id: refuse-compose-run-app
    question: "How do I write a docker-compose.yml to run my web app and database together?"
    class: should-refuse
    expect_source: null
    expect_docs: []
    tags: [near-miss]
    note: >-
      The highest-scoring refusal in the set (0.785) and the best collision found:
      bake/compose-file.md is about consuming a Compose file AS a bake definition, not
      about running services. The corpus contains zero chunks mentioning "compose up".
      If any question in this class gets fabricated, it will be this one.

  - id: refuse-kubeadm-upgrade
    question: "How do I upgrade a cluster with kubeadm?"
    class: should-refuse
    expect_source: null
    expect_docs: []
    tags: [near-miss]
    note: >-
      In-domain but outside the slice: the corpus is .../docs/concepts, and cluster
      upgrades live in /docs/tasks. kubeadm is named in nine chunks, always as a link
      out. Scores 0.769. Tests the boundary of the corpus, not the boundary of the
      subject.

  - id: refuse-dockerhub-rate-limits
    question: "What are the Docker Hub image pull rate limits?"
    class: should-refuse
    expect_source: null
    expect_docs: []
    tags: [near-miss]
    note: >-
      The Docker-side mirror of refuse-kubeadm-upgrade: the slice is manuals/build, and
      Docker Hub's limits are documented elsewhere. Scores 0.750 against a BuildKit
      registry-mirror page, which is adjacent enough to be quotable and does not
      contain a single number the question asks for.

  - id: refuse-capital-of-france
    question: "What is the capital of France?"
    class: should-refuse
    expect_source: null
    expect_docs: []
    tags: []
    note: >-
      The only question in the set that the retrieval floor refuses on its own (0.455
      vs floor 0.55). Kept deliberately easy: it is the control that proves gate 1
      fires at all, so a refusal-recall number can be read as "which gate did the
      work", not just "it refused".

  # --------------------------------------------------------------------------
  # Kubernetes workloads — pods, controllers, scheduling, autoscaling
  # (merged from candidates/k8s-workloads.yaml)
  # --------------------------------------------------------------------------


  # ------------------------------------------------------------ k8s-answerable (10)

  - id: k8s-replicaset-basics
    question: "What is a ReplicaSet?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["workloads/controllers/replicaset.md"]
    tags: [easy]
    note: >-
      The workloads-slice sanity case, with one twist that makes it worth more than
      k8s-pod-basics: top-1 is replicationcontroller.md (0.808) — the legacy API whose
      page is written as a near-copy of the ReplicaSet page — and replicaset.md is only
      rank 2 (0.801, a 0.007 gap). Three of the five hits are the right page, so
      hit-rate@5 passes; MRR is 0.5. A reranker that cannot separate two pages that
      differ by one deprecated noun has nothing to offer on the harder questions.

  - id: k8s-restart-policy-values
    question: "What values can restartPolicy have for a Pod?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["workloads/pods/pod-lifecycle.md"]
    tags: [exact-term]
    note: >-
      A camelCase field name that three different pages discuss, and the baseline picks
      the wrong one: ranks 1, 2 and 4 are all job.md (top-1 0.830), which talks about
      restartPolicy only as a Job constraint, while pod-lifecycle.md — the page that
      lists Always / OnFailure / Never — is rank 3 (0.806). MRR 0.333 with the answer
      sitting behind 113 chunks of Job documentation: the single clearest intra-source
      MRR target in the workloads set. A wrong answer here looks authoritative, because
      job.md really does say "restartPolicy".

  - id: k8s-job-indexed-completion
    question: "What does completionMode Indexed do for a Job?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["workloads/controllers/job.md"]
    tags: [exact-term]
    note: >-
      An exact term inside the second-largest document in the corpus (job.md, 113
      chunks). All five hits are that page, rank 1 at 0.802, and ranks 1-2 are the
      Indexed-completion section itself — so this is the control for
      k8s-restart-policy-values: same page, same kind of literal, but the baseline gets
      it right. If a Phase 3 fusion arm moves this one down, the regression is in
      tokenisation, not in ranking.

  - id: k8s-cronjob-concurrency-policy
    question: "What is the difference between the Forbid and Replace concurrencyPolicy in a CronJob?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["workloads/controllers/cron-jobs.md"]
    tags: [exact-term]
    note: >-
      Two enum values of one field, and the answer needs both. Rank 1 (0.854) is the
      chunk that enumerates the policies and rank 3 is the chunk that explains Replace,
      so this is a citation-validity question more than a hit-rate one: the top-5 holds
      the whole answer only if both chunks survive into the prompt. Rank 5 is job.md on
      concurrent pods (0.738) — plausible, wrong, and quotable.

  - id: k8s-hpa-stabilization-window
    question: "What does stabilizationWindowSeconds do in a HorizontalPodAutoscaler?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["workloads/autoscaling/horizontal-pod-autoscale.md"]
    tags: [exact-term]
    note: >-
      Right page, wrong chunks — the failure mode hit-rate@5 cannot see. All five hits
      are horizontal-pod-autoscale.md (top-1 0.769) so hit-rate@5 is 1.0 and MRR is
      1.0, but the retrieved chunks are the page's overview (L57-63), its API-stability
      note and a scaling-policy example; the section that defines the stabilization
      window is in none of them. The scores are also flat — 0.769 down to 0.757 across
      60 chunks of one page — which is the dense arm saying it cannot tell these chunks
      apart. Expect a grounded-but-incomplete answer at baseline; this is the question
      a reranker should fix without moving either retrieval metric at all.

  - id: k8s-nodeselector-placement
    question: "What does nodeSelector do?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["scheduling-eviction/assign-pod-node.md"]
    tags: [exact-term, cross-source]
    note: >-
      An F10 trap on a pure Kubernetes API field: top-1 is a DOCKER page
      (builders/drivers/kubernetes.md, 0.758) because buildx's Kubernetes driver takes
      a nodeSelector option of its own, and rank 4 is the same Docker page again.
      assign-pod-node.md, which defines the field, is rank 2 (0.719) — so MRR is 0.5
      and the top-ranked chunk is both wrong and from the wrong doc set. Citing Docker
      here is a source-accuracy failure; it is also the most natural mistake in the set,
      since the word appears verbatim in both places.

  - id: k8s-daemonset-per-node
    question: "How do I make sure exactly one log collector pod runs on every node?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["workloads/controllers/daemonset.md", "workloads/controllers/_index.md"]
    tags: [paraphrase]
    note: >-
      Never says "DaemonSet", and the page that answers it never appears: top-1 is
      cluster-administration/logging.md (0.782, node-level logging agents), rank 2 is a
      DRA page, and daemonset.md is absent from the top 5 entirely. What does land, at
      rank 3, is the one overview paragraph in controllers/_index.md that describes a
      DaemonSet as node-local Pods — enough to name the right API, not enough to
      answer. So hit-rate@5 scores this a hit (MRR 0.333) while the real answer was
      never retrieved: read this question together with k8s-hpa-stabilization-window
      before trusting an aggregate hit-rate.

  - id: k8s-autoscale-on-traffic
    question: "How do I make my application run more copies automatically when traffic increases?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["workloads/autoscaling/horizontal-pod-autoscale.md", "workloads/autoscaling.md"]
    tags: [paraphrase]
    note: >-
      The Kubernetes counterpart to dkr-shrink-image, and the only outright baseline
      MISS in this candidate set: no "autoscale", "HorizontalPodAutoscaler", "replicas"
      or "metric", so neither expected page appears at all. Top-1 is
      replicationcontroller.md on release tracks (0.701), rank 3 is a Docker page, and
      rank 4 is deployment.md's *proportional scaling during rollout* section — the
      most dangerous hit in the whole candidate set, because it is about scaling and is
      not about autoscaling. Lowest top-1 margin here (+0.151 over floor), so this is
      also the answerable question most likely to be falsely refused. Hit-rate@5 0.0
      and MRR 0.0 at baseline: headroom for Phase 4 by construction.

  - id: k8s-init-container-wait
    question: "How do I wait for a database to be ready before my application container starts?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["workloads/pods/init-containers.md"]
    tags: [paraphrase]
    note: >-
      Init-container coverage from the problem end rather than the API end (contrast
      k8s-init-vs-sidecar-containers, which names both features). Uses none of the
      page's vocabulary — not "init container", not "block", not "app container" — and
      still lands rank 1 at 0.728, with three of five hits on the right page. Recorded
      as a baseline fact worth keeping: dense retrieval does handle *some* paraphrases
      unaided, so a rewriter that only ever helps must be shown not to hurt this one.
      Rank 2 is containers/images.md on ImagePullBackOff — a different reason a
      container has not started yet.

  - id: k8s-toleration-dedicated-node
    question: "How do I allow a pod to be scheduled onto a node that most other pods are kept away from?"
    class: k8s-answerable
    expect_source: kubernetes
    expect_docs: ["scheduling-eviction/taint-and-toleration.md"]
    tags: [paraphrase]
    note: >-
      Tolerations from the other side of k8s-noexecute-taint: that question names an
      exact taint effect, this one names no scheduling vocabulary at all — no "taint",
      "toleration", "dedicated" or "affinity". taint-and-toleration.md reaches rank 3
      (0.822) behind a DRA internals page (0.858) and daemonset.md's
      tolerations-it-adds-automatically section (0.825), which is adjacent enough to
      mislead. Every one of the five scores is above 0.81, so the gate is wide open and
      ranking is the only thing protecting the answer.

  # ------------------------------------------------------------ should-refuse (1)

  - id: refuse-keda-scaledobject
    question: "What is a KEDA ScaledObject?"
    class: should-refuse
    expect_source: null
    expect_docs: []
    tags: [near-miss]
    note: >-
      The workloads-side near-miss, and a sharper one than refuse-kubeadm-upgrade: KEDA
      is not outside the corpus, it is *named in it*. workloads/autoscaling.md describes
      KEDA in two chunks — as a CNCF project, with a link to keda.sh — and those two
      chunks are ranks 1 and 3 (top-1 0.742, clearing floor 0.55 by +0.192). The word
      "ScaledObject" appears in zero chunks of 4,908. So the retrieved text is on-topic,
      in-corpus, about the right project, and cannot define the object asked about: the
      floor cannot catch this and only the citation check can. Fabrication risk is high
      because KEDA's CRD is well known outside these docs — this is the question that
      tests whether the answer comes from the retrieved chunks or from the model.

