      attestation, and only the surrounding words separate them. Retrieval keeps them
      apart today — top-1 0.850, ranks 1-4 all slsa-provenance.md — so if a lexical arm
      that keys on `mode=max` starts returning cache pages for this question, or
      attestation pages for dkr-cache-mode-max, the pair catches it. Merge both or
      neither.

