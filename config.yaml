# The experiment knobs. One config = one eval run. The corpus lives in sources.yaml.
#
# Everything below the PHASE 1 line is commented out until its phase lands. This is
# safe because every optional component defaults to its null object in code — a
# commented-out `rerank:` block and `rerank.enabled: false` mean exactly the same
# thing. Uncomment a block to turn the experiment on.

infrachat:

  # ---------------------------------------------------------------- PHASE 1
  data_dir: "./data"                 # infrachat.db lives here — one Docker volume

  corpus:
    sources_file: "sources.yaml"

  chunk:
    size: 800
    overlap: 100

  embedder:
    model: "BAAI/bge-small-en-v1.5"  # 384-dim, ONNX via fastembed, no torch

  retrieval:
    retrieve_n: 20                   # candidates fetched (only matters once rerank is on)
    k: 5                             # final chunks sent to the LLM
    floor: 0.65                      # below this top-1 score => refuse (F8)
                                     # Derived, not guessed: min(answerable) - 1 SD
                                     # = 0.7014 - 0.0428. See eval/floor-tuning.md.
                                     # The accuracy-maximising value (0.73) scores
                                     # 79.3% fitted but 75.2% under cross-validation
                                     # — worse than not tuning. Gate 1 is an
                                     # out-of-distribution trip-wire, not a classifier:
                                     # it can carry ~2 of 21 refusals here, gate 2
                                     # carries the other 19.

  eval:
    question_set: "eval/questions.yaml"
    results_dir: "eval/runs"
    run_label: "baseline"

  # The generator. `ingest` and `ask --retrieval-only` still run without a key.
  llm:
    base_url: "https://api.groq.com/openai/v1"
    model: "openai/gpt-oss-20b"
    api_key_env: "INFRACHAT_LLM_API_KEY"   # the env var NAME, never the key
    max_context_chunks: 5
    max_tokens: 4096          # must cover hidden reasoning tokens, not just the answer

  # ---------------------------------------------------------------- PHASE 2
  # A cross-encoder re-scores the top-20 jointly and keeps the best 5.
  # Built (infrachat/retrieve/rerank.py) but left OFF: cli.py::_build_deps still
  # constructs the pass-through unconditionally, so flipping this to true today
  # only makes the CLI refuse to run. Turn it on together with that change, and
  # change eval.run_label to "+reranker" in the same edit — a Phase 2 run written
  # to baseline.jsonl is worse than no run.
  #
  # The reranker reorders; it does NOT rewrite `score`, so `floor` above keeps
  # meaning what eval/floor-tuning.md tuned it to mean. See the module docstring.
  rerank:
    enabled: false
    model: "Xenova/ms-marco-MiniLM-L-6-v2"

  # ---------------------------------------------------------------- PHASE 3
  # A BM25 arm (SQLite FTS5) fused with dense results by reciprocal rank.
  # Enabling this needs a re-ingest — it adds an index to the offline path.
  # retrieval:
  #   hybrid:
  #     enabled: true
  #     fusion: rrf

  # ---------------------------------------------------------------- PHASE 4
  # A small, cheap LLM rewrites the question before retrieval. Costs an LLM call
  # on every query — the eval measures whether that earns its latency.
  # rewrite:
  #   enabled: true
  #   model: "llama-3.1-8b-instant"
